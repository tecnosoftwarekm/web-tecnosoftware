<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - TecnoSoftware</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #F4F7F6; padding: 20px; color: #333; margin: 0;}
        
        /* Contenedor más ajustado */
        .admin-container { background: #fff; max-width: 850px; margin: 0 auto 20px auto; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1A4A8D; text-align: center; margin-bottom: 15px; margin-top: 0; font-size: 1.4rem; }
        
        /* --- NAVEGACIÓN DEL DASHBOARD (TABS) COMPACTA --- */
        .admin-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn { background: #f8f9fa; color: #333; border: 1px solid #ccc; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; margin: 0; font-size: 0.85rem; }
        .tab-btn:hover { background: #e2e8f0; }
        .tab-btn.activo { background: #1A4A8D; color: white; border-color: #1A4A8D; }
        .btn-salir { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 0; font-size: 0.85rem; }
        .btn-salir:hover { background-color: #a71d2a; }

        /* --- FORMULARIO COMPACTO (A COLUMNAS) --- */
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .span-1 { grid-column: span 1; }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }
        
        .form-group { margin-bottom: 5px; }
        label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.8rem; color: #444; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 0.9rem; }
        
        .botones-form { display: flex; gap: 10px; margin-top: 15px; }
        button.btn-principal { background-color: #2D7DEB; color: white; border: none; padding: 10px; flex: 1; font-size: 0.95rem; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;}
        button.btn-principal:hover { background-color: #1A4A8D; }
        .btn-gris { background-color: #6c757d; }
        .btn-gris:hover { background-color: #5a6268; }

        /* --- INVENTARIO, BUSCADOR Y TABLA COMPACTA --- */
        .buscador-admin { width: 100%; padding: 10px; border: 2px solid #2D7DEB; border-radius: 4px; font-size: 0.9rem; margin-bottom: 15px; outline: none; }
        .tabla-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.85rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f8f9fa; color: #1A4A8D; font-weight: bold; }
        
        /* Botones en línea para las acciones */
        .celda-acciones { white-space: nowrap; }
        .btn-accion { padding: 5px 8px; font-size: 0.75rem; margin: 0 4px 0 0; display: inline-block; cursor: pointer; font-weight: bold; border-radius: 3px; border: none; color: white; }
        .btn-editar { background-color: #f59e0b; }
        .btn-editar:hover { background-color: #d97706; }
        .btn-eliminar { background-color: #dc3545; }
        .btn-eliminar:hover { background-color: #a71d2a; }

        /* --- PAGINACIÓN --- */
        .paginacion-container { display: flex; justify-content: center; gap: 5px; margin-top: 15px; }
        .btn-page { background: #f8f9fa; border: 1px solid #ccc; padding: 6px 10px; cursor: pointer; border-radius: 3px; font-weight: bold; transition: 0.3s; font-size: 0.85rem; }
        .btn-page:hover { background: #e2e8f0; }
        .btn-page.activo { background: #2D7DEB; color: white; border-color: #2D7DEB; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

        #mensaje, #login-mensaje { text-align: center; margin-top: 10px; font-weight: bold; font-size: 0.9rem;}
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div class="admin-container" id="pantalla-login" style="max-width: 400px; margin-top: 50px;">
        <h2>Acceso Administrativo</h2>
        <form id="form-login">
            <div class="form-group span-3">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group span-3" style="margin-top: 10px;">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-principal" id="btn-login" style="margin-top: 15px;">Entrar</button>
            <div id="login-mensaje" style="color: red;"></div>
        </form>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div class="admin-container oculto" id="pantalla-admin">
        
        <!-- Menú Superior (Tabs) -->
        <div class="admin-nav">
            <div class="tabs">
                <button class="tab-btn activo" id="tab-form" onclick="cambiarVista('form')">Subir / Editar Producto</button>
                <button class="tab-btn" id="tab-inv" onclick="cambiarVista('inv')">Gestión de Inventario</button>
            </div>
            <button class="btn-salir" id="btn-cerrar-sesion">Cerrar Sesión</button>
        </div>

        <!-- VISTA 1: FORMULARIO -->
        <div id="vista-form">
            <h2 id="titulo-formulario">Subir Nuevo Producto</h2>
            
            <form id="form-producto">
                <!-- GRID COMPACTO DE 3 COLUMNAS -->
                <div class="form-grid">
                    <!-- Fila 1 -->
                    <div class="form-group span-2">
                        <label>Nombre del Producto</label>
                        <input type="text" id="nombre" placeholder="Ej. Servidor NAS" required>
                    </div>
                    <div class="form-group span-1">
                        <label>Precio (USD)</label>
                        <input type="number" id="precio" step="0.01" placeholder="Ej. 150" required>
                    </div>
                    
                    <!-- Fila 2 -->
                    <div class="form-group span-1">
                        <label>Categoría</label>
                        <select id="categoria" required>
                            <option value="Computación">Computación</option>
                            <option value="Licencias">Licencias</option>
                            <option value="Redes">Redes</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div class="form-group span-1">
                        <label>Condición</label>
                        <select id="condicion" required>
                            <option value="Nuevo">Nuevo</option>
                            <option value="Usado">Usado</option>
                            <option value="Refurbished">Refurbished</option>
                        </select>
                    </div>
                    <div class="form-group span-1">
                        <label>URL de Imagen</label>
                        <input type="text" id="imagenUrl" placeholder="https://i.ibb.co/foto.jpg" required>
                    </div>

                    <!-- Fila 3 -->
                    <div class="form-group span-3">
                        <label>Breve Descripción (Características)</label>
                        <input type="text" id="descripcion" placeholder="Ej. i5 12va, 16GB RAM, RTX 3070, 500GB SSD...">
                    </div>
                </div>
                
                <!-- Botones agrupados -->
                <div class="botones-form">
                    <button type="submit" class="btn-principal" id="btn-guardar">Guardar Producto</button>
                    <button type="button" id="btn-cancelar" class="btn-principal btn-gris oculto" onclick="cancelarEdicion()">Cancelar Edición</button>
                </div>
                <div id="mensaje"></div>
            </form>
        </div>

        <!-- VISTA 2: INVENTARIO, BÚSQUEDA Y TABLA -->
        <div id="vista-inv" class="oculto">
            <h2 style="margin-bottom: 10px;">Inventario Actual</h2>
            
            <input type="text" id="buscador-admin" class="buscador-admin" placeholder="🔍 Buscar por nombre de producto...">

            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Condición</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                    </tbody>
                </table>
            </div>

            <!-- Contenedor de Paginación -->
            <div class="paginacion-container" id="paginacion"></div>
        </div>

    </div>

    <!-- Módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH5XGtcwOwVjSiBtfV7ZutShgKMCl9O-I",
            authDomain: "tecnosoftwaretienda.firebaseapp.com",
            projectId: "tecnosoftwaretienda",
            storageBucket: "tecnosoftwaretienda.firebasestorage.app",
            messagingSenderId: "367617419083",
            appId: "1:367617419083:web:93ad27ea5db146f046eace",
            measurementId: "G-VS7RFYPVEC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const pantallaLogin = document.getElementById('pantalla-login');
        const pantallaAdmin = document.getElementById('pantalla-admin');
        
        let productoEditandoId = null;

        // --- VARIABLES DE PAGINACIÓN Y BÚSQUEDA ---
        let inventarioGlobal = [];
        let paginaActual = 1;
        const ITEMS_POR_PAGINA = 5;
        let busquedaTexto = "";

        // =====================================
        // CONTROL DE VISTAS (TABS)
        // =====================================
        window.cambiarVista = function(vista) {
            const vistaForm = document.getElementById('vista-form');
            const vistaInv = document.getElementById('vista-inv');
            const tabForm = document.getElementById('tab-form');
            const tabInv = document.getElementById('tab-inv');

            if(vista === 'form') {
                vistaForm.classList.remove('oculto');
                vistaInv.classList.add('oculto');
                tabForm.classList.add('activo');
                tabInv.classList.remove('activo');
            } else {
                vistaForm.classList.add('oculto');
                vistaInv.classList.remove('oculto');
                tabForm.classList.remove('activo');
                tabInv.classList.add('activo');
                descargarInventario(); // Recargar datos frescos
            }
        };

        // =====================================
        // AUTENTICACIÓN
        // =====================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                pantallaLogin.classList.add('oculto');
                pantallaAdmin.classList.remove('oculto');
                descargarInventario(); 
            } else {
                pantallaLogin.classList.remove('oculto');
                pantallaAdmin.classList.add('oculto');
            }
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');
            btnLogin.innerText = "Verificando...";
            btnLogin.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('login-mensaje').innerText = "";
            } catch (error) {
                document.getElementById('login-mensaje').innerText = "Correo o contraseña incorrectos.";
                btnLogin.innerText = "Entrar";
                btnLogin.disabled = false;
            }
        });

        document.getElementById('btn-cerrar-sesion').addEventListener('click', () => signOut(auth));

        // =====================================
        // LÓGICA DE INVENTARIO Y PAGINACIÓN
        // =====================================
        async function descargarInventario() {
            const tbody = document.getElementById('cuerpo-tabla');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Cargando inventario...</td></tr>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "productos"));
                inventarioGlobal = [];
                
                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    p.id = docSnap.id;
                    inventarioGlobal.push(p);
                });
                
                renderizarTabla();
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Error al cargar los datos.</td></tr>';
            }
        }

        document.getElementById('buscador-admin').addEventListener('input', (e) => {
            busquedaTexto = e.target.value.toLowerCase();
            paginaActual = 1; 
            renderizarTabla();
        });

        window.cambiarPagina = function(nuevaPagina) {
            paginaActual = nuevaPagina;
            renderizarTabla();
        };

        function renderizarTabla() {
            const tbody = document.getElementById('cuerpo-tabla');
            const paginacion = document.getElementById('paginacion');
            tbody.innerHTML = '';
            paginacion.innerHTML = '';

            const filtrados = inventarioGlobal.filter(p => p.nombre.toLowerCase().includes(busquedaTexto));

            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">No hay productos encontrados.</td></tr>';
                return;
            }

            const totalPaginas = Math.ceil(filtrados.length / ITEMS_POR_PAGINA);
            const inicio = (paginaActual - 1) * ITEMS_POR_PAGINA;
            const fin = inicio + ITEMS_POR_PAGINA;
            const paginaProductos = filtrados.slice(inicio, fin);

            paginaProductos.forEach(p => {
                const tr = document.createElement('tr');
                const nombreSeguro = p.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const descSegura = (p.descripcion || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                tr.innerHTML = `
                    <td style="font-weight: 500; color: #1A4A8D;">${p.nombre}</td>
                    <td style="font-weight: bold;">$${p.precioUSD.toFixed(2)}</td>
                    <td>${p.categoria || 'Otros'}</td>
                    <td>${p.condicion || 'N/A'}</td>
                    <td class="celda-acciones">
                        <button class="btn-accion btn-editar" onclick="window.prepararEdicion('${p.id}', '${nombreSeguro}', ${p.precioUSD}, '${p.categoria || 'Otros'}', '${p.condicion}', '${p.imgUrl}', '${descSegura}')">Editar</button>
                        <button class="btn-accion btn-eliminar" onclick="window.eliminarProducto('${p.id}')">Borrar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (totalPaginas > 1) {
                const btnAnt = document.createElement('button');
                btnAnt.className = 'btn-page';
                btnAnt.innerText = '«';
                btnAnt.disabled = paginaActual === 1;
                btnAnt.onclick = () => cambiarPagina(paginaActual - 1);
                paginacion.appendChild(btnAnt);

                for (let i = 1; i <= totalPaginas; i++) {
                    const btnNum = document.createElement('button');
                    btnNum.className = `btn-page ${i === paginaActual ? 'activo' : ''}`;
                    btnNum.innerText = i;
                    btnNum.onclick = () => cambiarPagina(i);
                    paginacion.appendChild(btnNum);
                }

                const btnSig = document.createElement('button');
                btnSig.className = 'btn-page';
                btnSig.innerText = '»';
                btnSig.disabled = paginaActual === totalPaginas;
                btnSig.onclick = () => cambiarPagina(paginaActual + 1);
                paginacion.appendChild(btnSig);
            }
        }

        // =====================================
        // CRUD (GUARDAR, EDITAR, ELIMINAR)
        // =====================================
        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const mensaje = document.getElementById('mensaje');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const datosProducto = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precioUSD: parseFloat(document.getElementById('precio').value),
                categoria: document.getElementById('categoria').value, 
                condicion: document.getElementById('condicion').value,
                imgUrl: document.getElementById('imagenUrl').value
            };

            try {
                if (productoEditandoId) {
                    await updateDoc(doc(db, "productos", productoEditandoId), datosProducto);
                    mensaje.innerText = "¡Producto actualizado correctamente!";
                    window.cancelarEdicion(); 
                } else {
                    await addDoc(collection(db, "productos"), datosProducto);
                    mensaje.innerText = "¡Producto guardado con éxito!";
                    document.getElementById('form-producto').reset();
                }
                
                mensaje.style.color = "green";
                setTimeout(() => mensaje.innerText = "", 3000);

            } catch (error) {
                mensaje.innerText = "Error al guardar. Revisa la consola.";
                mensaje.style.color = "red";
            }
            btn.disabled = false;
            if(!productoEditandoId) btn.innerText = "Guardar Producto";
        });

        window.prepararEdicion = function(id, nombre, precio, categoria, condicion, imgUrl, descripcion) {
            productoEditandoId = id;
            document.getElementById('titulo-formulario').innerText = "Editando Producto";
            document.getElementById('nombre').value = nombre;
            document.getElementById('descripcion').value = descripcion || ''; 
            document.getElementById('precio').value = precio;
            document.getElementById('categoria').value = categoria; 
            if(condicion && condicion !== 'undefined') document.getElementById('condicion').value = condicion;
            document.getElementById('imagenUrl').value = imgUrl;
            
            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = "Actualizar Producto";
            btnGuardar.style.backgroundColor = "#f59e0b"; 
            document.getElementById('btn-cancelar').classList.remove('oculto');
            
            cambiarVista('form');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelarEdicion = function() {
            productoEditandoId = null;
            document.getElementById('form-producto').reset();
            document.getElementById('titulo-formulario').innerText = "Subir Nuevo Producto";
            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = "Guardar Producto";
            btnGuardar.style.backgroundColor = "#2D7DEB"; 
            document.getElementById('btn-cancelar').classList.add('oculto');
        };

        window.eliminarProducto = async function(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este producto definitivamente?")) {
                try {
                    await deleteDoc(doc(db, "productos", id));
                    descargarInventario();
                } catch (error) {
                    alert("Ocurrió un error al intentar borrar el producto.");
                }
            }
        };
    </script>
</body>
</html>
