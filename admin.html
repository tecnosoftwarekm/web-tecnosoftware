<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - TecnoSoftware</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #F4F7F6; padding: 40px; color: #333; }
        .admin-container { background: #fff; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1A4A8D; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        /* Se agregó 'select' a esta línea para que herede el mismo diseño de los inputs */
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #2D7DEB; color: white; border: none; padding: 12px; width: 100%; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button:hover { background-color: #1A4A8D; }
        .btn-rojo { background-color: #dc3545; margin-top: 30px; }
        .btn-rojo:hover { background-color: #a71d2a; }
        #mensaje, #login-mensaje { text-align: center; margin-top: 15px; font-weight: bold; }
        .oculto { display: none; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div class="admin-container" id="pantalla-login">
        <h2>Acceso Administrativo</h2>
        <form id="form-login">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <div id="login-mensaje" style="color: red;"></div>
        </form>
    </div>

    <!-- PANTALLA DEL FORMULARIO DE PRODUCTOS -->
    <div class="admin-container oculto" id="pantalla-admin">
        <h2>Subir Nuevo Producto</h2>
        <form id="form-producto">
            <div class="form-group">
                <label>Nombre del Producto</label>
                <input type="text" id="nombre" placeholder="Ej. Servidor NAS" required>
            </div>
            <div class="form-group">
                <label>Precio (USD)</label>
                <input type="number" id="precio" step="0.01" placeholder="Ej. 150" required>
            </div>
            
            <!-- NUEVO CAMPO DE CONDICIÓN -->
            <div class="form-group">
                <label>Condición del Equipo</label>
                <select id="condicion" required>
                    <option value="Nuevo">Nuevo</option>
                    <option value="Usado">Usado</option>
                    <option value="Refurbished">Refurbished</option>
                </select>
            </div>

            <div class="form-group">
                <label>Enlace de la Imagen (URL)</label>
                <input type="text" id="imagenUrl" placeholder="https://tudominio.com/foto.jpg" required>
            </div>
            <button type="submit" id="btn-guardar">Guardar Producto</button>
            <div id="mensaje"></div>
        </form>

        <button class="btn-rojo" id="btn-cerrar-sesion">Cerrar Sesión</button>
    </div>

    <!-- Módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ¡LLAVE NUEVA ACTUALIZADA!
        const firebaseConfig = {
            apiKey: "AIzaSyAH5XGtcwOwVjSiBtfV7ZutShgKMCl9O-I",
            authDomain: "tecnosoftwaretienda.firebaseapp.com",
            projectId: "tecnosoftwaretienda",
            storageBucket: "tecnosoftwaretienda.firebasestorage.app",
            messagingSenderId: "367617419083",
            appId: "1:367617419083:web:93ad27ea5db146f046eace",
            measurementId: "G-VS7RFYPVEC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const pantallaLogin = document.getElementById('pantalla-login');
        const pantallaAdmin = document.getElementById('pantalla-admin');

        // Escuchar si hay alguien con sesión iniciada
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuario logueado: Muestra formulario, oculta login
                pantallaLogin.classList.add('oculto');
                pantallaAdmin.classList.remove('oculto');
            } else {
                // No hay usuario: Muestra login, oculta formulario
                pantallaLogin.classList.remove('oculto');
                pantallaAdmin.classList.add('oculto');
            }
        });

        // Lógica de Inicio de Sesión
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');
            const msjLogin = document.getElementById('login-mensaje');

            btnLogin.innerText = "Verificando...";
            btnLogin.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msjLogin.innerText = "";
            } catch (error) {
                console.error("Error de Firebase:", error);
                msjLogin.innerText = "Correo o contraseña incorrectos.";
                btnLogin.innerText = "Entrar";
                btnLogin.disabled = false;
            }
        });

        // Lógica de Cerrar Sesión
        document.getElementById('btn-cerrar-sesion').addEventListener('click', () => {
            signOut(auth);
        });

        // Lógica de Guardar Producto
        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const mensaje = document.getElementById('mensaje');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const nombre = document.getElementById('nombre').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const condicion = document.getElementById('condicion').value; // <-- CAPTURA DE CONDICIÓN
            const imagenUrl = document.getElementById('imagenUrl').value;

            try {
                await addDoc(collection(db, "productos"), {
                    nombre: nombre,
                    precioUSD: precio,
                    condicion: condicion, // <-- SE GUARDA EN FIREBASE
                    imgUrl: imagenUrl
                });

                mensaje.innerText = "¡Producto guardado con éxito!";
                mensaje.style.color = "green";
                document.getElementById('form-producto').reset();
            } catch (error) {
                console.error(error);
                mensaje.innerText = "Error al guardar. Revisa la consola.";
                mensaje.style.color = "red";
            }

            btn.innerText = "Guardar Producto";
            btn.disabled = false;
        });
    </script>
</body>
</html>
