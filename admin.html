<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - TecnoSoftware</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #F4F7F6; padding: 40px; color: #333; }
        .admin-container { background: #fff; max-width: 800px; margin: 0 auto 20px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1A4A8D; text-align: center; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #2D7DEB; color: white; border: none; padding: 12px; width: 100%; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s;}
        button:hover { background-color: #1A4A8D; }
        .btn-rojo { background-color: #dc3545; margin-top: 30px; }
        .btn-rojo:hover { background-color: #a71d2a; }
        .btn-gris { background-color: #6c757d; }
        .btn-gris:hover { background-color: #5a6268; }
        .tabla-container { margin-top: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #1A4A8D; font-weight: bold; }
        .btn-accion { padding: 6px 12px; font-size: 0.85rem; width: auto; margin-right: 5px; margin-top: 0; display: inline-block; }
        .btn-editar { background-color: #f59e0b; }
        .btn-editar:hover { background-color: #d97706; }
        .btn-eliminar { background-color: #dc3545; }
        #mensaje, #login-mensaje { text-align: center; margin-top: 15px; font-weight: bold; }
        .oculto { display: none !important; }
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }
        
        /* Flex para la fila de la tasa */
        .fila-tasa { display: flex; gap: 15px; align-items: flex-end; justify-content: center; }
        .fila-tasa .form-group { margin-bottom: 0; width: 200px; }
        .fila-tasa button { width: auto; margin-top: 0; padding: 10px 20px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div class="admin-container" id="pantalla-login" style="max-width: 500px;">
        <h2>Acceso Administrativo</h2>
        <form id="form-login">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <div id="login-mensaje" style="color: red;"></div>
        </form>
    </div>

    <!-- PANEL DE CONFIGURACIÓN DE TASA BCV -->
    <div class="admin-container oculto" id="pantalla-config">
        <h2 style="margin-bottom: 15px;">Actualizar Tasa BCV</h2>
        <div class="fila-tasa">
            <div class="form-group">
                <label>Tasa Actual (Bs.)</label>
                <input type="number" id="input-tasa" step="0.001" placeholder="Cargando...">
            </div>
            <button type="button" id="btn-actualizar-tasa">Actualizar Sistema</button>
        </div>
        <div id="msj-tasa" style="text-align: center; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- PANTALLA DEL FORMULARIO Y TABLA DE PRODUCTOS -->
    <div class="admin-container oculto" id="pantalla-admin">
        <h2 id="titulo-formulario">Subir Nuevo Producto</h2>
        
        <form id="form-producto">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" placeholder="Ej. Servidor NAS" required>
                </div>
                <!-- CAMPO DE DESCRIPCIÓN AÑADIDO -->
                <div class="form-group full-width">
                    <label>Breve Descripción (Características)</label>
                    <input type="text" id="descripcion" placeholder="Ej. i5 12va, 16GB RAM, RTX 3070, 500GB SSD...">
                </div>
                <div class="form-group">
                    <label>Precio (USD)</label>
                    <input type="number" id="precio" step="0.01" placeholder="Ej. 150" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria" required>
                        <option value="Computación">Computación</option>
                        <option value="Licencias">Licencias</option>
                        <option value="Redes">Redes</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Condición del Equipo</label>
                    <select id="condicion" required>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Usado">Usado</option>
                        <option value="Refurbished">Refurbished</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Enlace de la Imagen (URL)</label>
                    <input type="text" id="imagenUrl" placeholder="https://i.ibb.co/foto.jpg" required>
                </div>
            </div>
            
            <button type="submit" id="btn-guardar">Guardar Producto</button>
            <button type="button" id="btn-cancelar" class="btn-gris oculto" onclick="cancelarEdicion()">Cancelar Edición</button>
            <div id="mensaje"></div>
        </form>

        <hr>

        <h2>Inventario Actual</h2>
        <div class="tabla-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Condición</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                </tbody>
            </table>
        </div>

        <button class="btn-rojo" id="btn-cerrar-sesion">Cerrar Sesión</button>
    </div>

    <!-- Módulos de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAH5XGtcwOwVjSiBtfV7ZutShgKMCl9O-I",
            authDomain: "tecnosoftwaretienda.firebaseapp.com",
            projectId: "tecnosoftwaretienda",
            storageBucket: "tecnosoftwaretienda.firebasestorage.app",
            messagingSenderId: "367617419083",
            appId: "1:367617419083:web:93ad27ea5db146f046eace",
            measurementId: "G-VS7RFYPVEC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const pantallaLogin = document.getElementById('pantalla-login');
        const pantallaAdmin = document.getElementById('pantalla-admin');
        const pantallaConfig = document.getElementById('pantalla-config');
        
        let productoEditandoId = null;

        // =====================================
        // AUTENTICACIÓN
        // =====================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                pantallaLogin.classList.add('oculto');
                pantallaConfig.classList.remove('oculto');
                pantallaAdmin.classList.remove('oculto');
                cargarTasaActual(); // Carga la tasa
                cargarListaProductos(); // Carga los productos
            } else {
                pantallaLogin.classList.remove('oculto');
                pantallaConfig.classList.add('oculto');
                pantallaAdmin.classList.add('oculto');
            }
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');
            btnLogin.innerText = "Verificando...";
            btnLogin.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('login-mensaje').innerText = "";
            } catch (error) {
                document.getElementById('login-mensaje').innerText = "Correo o contraseña incorrectos.";
                btnLogin.innerText = "Entrar";
                btnLogin.disabled = false;
            }
        });

        document.getElementById('btn-cerrar-sesion').addEventListener('click', () => signOut(auth));

        // =====================================
        // LÓGICA DE TASA BCV
        // =====================================
        async function cargarTasaActual() {
            try {
                const docSnap = await getDoc(doc(db, "configuracion", "valores"));
                if (docSnap.exists()) {
                    document.getElementById('input-tasa').value = docSnap.data().tasaBCV;
                }
            } catch (error) {
                console.error("Error al cargar la tasa:", error);
            }
        }

        document.getElementById('btn-actualizar-tasa').addEventListener('click', async () => {
            const nuevaTasa = parseFloat(document.getElementById('input-tasa').value);
            const msj = document.getElementById('msj-tasa');
            const btn = document.getElementById('btn-actualizar-tasa');

            if(!nuevaTasa || nuevaTasa <= 0) {
                msj.innerText = "Ingresa un valor válido.";
                msj.style.color = "red";
                return;
            }

            btn.innerText = "Actualizando...";
            btn.disabled = true;

            try {
                await setDoc(doc(db, "configuracion", "valores"), { tasaBCV: nuevaTasa });
                msj.innerText = "¡Tasa actualizada con éxito en toda la tienda!";
                msj.style.color = "green";
                setTimeout(() => msj.innerText = "", 4000);
            } catch(e) {
                console.error(e);
                msj.innerText = "Error al actualizar la tasa.";
                msj.style.color = "red";
            }
            btn.innerText = "Actualizar Sistema";
            btn.disabled = false;
        });

        // =====================================
        // LÓGICA DE PRODUCTOS
        // =====================================
        window.cargarListaProductos = async function() {
            const tbody = document.getElementById('cuerpo-tabla');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Cargando inventario...</td></tr>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "productos"));
                tbody.innerHTML = '';
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">No hay productos registrados aún.</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const tr = document.createElement('tr');
                    const nombreSeguro = p.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const descSegura = (p.descripcion || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    tr.innerHTML = `
                        <td style="font-weight: 500; color: #1A4A8D;">${p.nombre}</td>
                        <td style="font-weight: bold;">$${p.precioUSD.toFixed(2)}</td>
                        <td>${p.categoria || 'Otros'}</td>
                        <td>${p.condicion || 'N/A'}</td>
                        <td>
                            <button class="btn-accion btn-editar" onclick="window.prepararEdicion('${docSnap.id}', '${nombreSeguro}', ${p.precioUSD}, '${p.categoria || 'Otros'}', '${p.condicion}', '${p.imgUrl}', '${descSegura}')">Editar</button>
                            <button class="btn-accion btn-eliminar" onclick="window.eliminarProducto('${docSnap.id}')">Borrar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Error al cargar los datos.</td></tr>';
            }
        };

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const mensaje = document.getElementById('mensaje');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const datosProducto = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value, // GUARDAR DESCRIPCIÓN
                precioUSD: parseFloat(document.getElementById('precio').value),
                categoria: document.getElementById('categoria').value, 
                condicion: document.getElementById('condicion').value,
                imgUrl: document.getElementById('imagenUrl').value
            };

            try {
                if (productoEditandoId) {
                    await updateDoc(doc(db, "productos", productoEditandoId), datosProducto);
                    mensaje.innerText = "¡Producto actualizado correctamente!";
                    window.cancelarEdicion(); 
                } else {
                    await addDoc(collection(db, "productos"), datosProducto);
                    mensaje.innerText = "¡Producto guardado con éxito!";
                    document.getElementById('form-producto').reset();
                }
                
                mensaje.style.color = "green";
                cargarListaProductos(); 
                setTimeout(() => mensaje.innerText = "", 3000);

            } catch (error) {
                mensaje.innerText = "Error al guardar. Revisa la consola.";
                mensaje.style.color = "red";
            }
            btn.disabled = false;
            if(!productoEditandoId) btn.innerText = "Guardar Producto";
        });

        window.prepararEdicion = function(id, nombre, precio, categoria, condicion, imgUrl, descripcion) {
            productoEditandoId = id;
            document.getElementById('titulo-formulario').innerText = "Editando Producto";
            document.getElementById('nombre').value = nombre;
            document.getElementById('descripcion').value = descripcion || ''; // LLENAR DESCRIPCIÓN
            document.getElementById('precio').value = precio;
            document.getElementById('categoria').value = categoria; 
            if(condicion && condicion !== 'undefined') document.getElementById('condicion').value = condicion;
            document.getElementById('imagenUrl').value = imgUrl;
            
            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = "Actualizar Producto";
            btnGuardar.style.backgroundColor = "#f59e0b"; 
            document.getElementById('btn-cancelar').classList.remove('oculto');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelarEdicion = function() {
            productoEditandoId = null;
            document.getElementById('form-producto').reset();
            document.getElementById('titulo-formulario').innerText = "Subir Nuevo Producto";
            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.innerText = "Guardar Producto";
            btnGuardar.style.backgroundColor = "#2D7DEB"; 
            document.getElementById('btn-cancelar').classList.add('oculto');
        };

        window.eliminarProducto = async function(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este producto definitivamente?")) {
                try {
                    await deleteDoc(doc(db, "productos", id));
                    cargarListaProductos();
                } catch (error) {
                    alert("Ocurrió un error al intentar borrar el producto.");
                }
            }
        };
    </script>
</body>
</html>
